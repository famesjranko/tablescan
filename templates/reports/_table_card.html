<!-- Table Card Component -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden" x-data="{ showPreview: false, previewData: null, loading: false }">
    <div class="px-4 py-3 border-b border-gray-200 bg-gray-50">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="h-5 w-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z" clip-rule="evenodd"/>
                </svg>
                <div>
                    <h3 class="text-sm font-medium text-gray-900">
                        Page {{ table.page_num }}, Table {{ table.table_num }}
                    </h3>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                {% if table.csv_file %}
                <a href="{{ table.csv_file.url }}" download class="inline-flex items-center px-2.5 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    CSV
                </a>
                {% endif %}
                {% if table.json_file %}
                <a href="{{ table.json_file.url }}" download class="inline-flex items-center px-2.5 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    JSON
                </a>
                {% endif %}
                {% if table.csv_file %}
                <button
                    @click="if (!previewData) { loading = true; fetch('{% url 'table_preview' table.id %}').then(r => r.json()).then(d => { previewData = d; loading = false; }); } showPreview = !showPreview"
                    class="inline-flex items-center px-2.5 py-1.5 border border-primary text-xs font-medium rounded text-primary bg-white hover:bg-blue-50"
                >
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <span x-text="showPreview ? 'Hide' : 'Preview'">Preview</span>
                </button>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Preview Section -->
    <div x-show="showPreview" x-cloak class="border-t border-gray-200">
        <template x-if="loading">
            <div class="p-8 text-center">
                <svg class="animate-spin h-8 w-8 text-primary mx-auto" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-sm text-gray-500">Loading preview...</p>
            </div>
        </template>
        <template x-if="previewData && !loading">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <!-- Hierarchical headers with colspan when header_spans available -->
                        <template x-if="previewData.header_spans && previewData.header_spans.length > 0">
                            <template x-for="rowIdx in [...new Set(previewData.header_spans.map(s => s.row))].sort()" :key="'row-' + rowIdx">
                                <tr>
                                    <template x-for="span in previewData.header_spans.filter(s => s.row === rowIdx)" :key="'span-' + span.row + '-' + span.col">
                                        <th :colspan="span.colspan"
                                            class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider border-b border-gray-200"
                                            x-text="span.value"></th>
                                    </template>
                                </tr>
                            </template>
                        </template>
                        <!-- Flat headers (fallback when no hierarchy) -->
                        <template x-if="!previewData.header_spans || previewData.header_spans.length === 0">
                            <tr>
                                <template x-for="(header, index) in previewData.headers" :key="index">
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="header || `Column ${index + 1}`"></th>
                                </template>
                            </tr>
                        </template>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="(row, rowIndex) in previewData.rows" :key="rowIndex">
                            <tr :class="rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50'">
                                <template x-for="(cell, cellIndex) in row" :key="cellIndex">
                                    <td class="px-4 py-2 text-sm text-gray-900 whitespace-nowrap" x-text="cell"></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template x-if="previewData.truncated">
                    <div class="px-4 py-2 bg-yellow-50 text-sm text-yellow-700 border-t border-yellow-100">
                        Showing first <span x-text="previewData.rows.length"></span> rows. Download the file for complete data.
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
