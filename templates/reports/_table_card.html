<!-- Table Card Component with Method Selector -->
{% load static %}
<div class="bg-white rounded-lg shadow-sm border border-gray-200"
     x-data='tableCard{{ table.id }}()'>
<script>
function tableCard{{ table.id }}() {
    return {
        showPreview: false,
        previewData: null,
        loading: false,
        switching: false,
        variants: JSON.parse('{{ table.variants_json|escapejs|default:"[]" }}'),
        currentMethod: '{{ table.extraction_method|default:""|escapejs }}',
        variantsAvailable: {{ table.variants_available|yesno:'true,false' }},
        selectedMethod: '{{ table.extraction_method|default:""|escapejs }}',
        showMethodDropdown: false,
        // Dynamic state for method switching
        extractedId: {{ table.id }},
        csvUrl: '{{ table.csv_file.url|default:"" }}',
        jsonUrl: '{{ table.json_file.url|default:"" }}',

        async switchMethod() {
            if (this.selectedMethod === this.currentMethod) return;
            this.switching = true;
            try {
                const response = await fetch(`/api/extracted/${this.extractedId}/switch-method/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    body: JSON.stringify({ method: this.selectedMethod })
                });
                if (response.ok) {
                    const data = await response.json();
                    // Update state with new extraction
                    this.extractedId = data.extracted_id;
                    this.csvUrl = data.csv_url || '';
                    this.jsonUrl = data.json_url || '';
                    this.currentMethod = this.selectedMethod;
                    this.previewData = null;  // Invalidate cache

                    // Re-fetch preview if open
                    if (this.showPreview && data.preview_url) {
                        this.loading = true;
                        try {
                            const previewResp = await fetch(data.preview_url);
                            this.previewData = await previewResp.json();
                        } catch (e) {
                            console.error('Failed to load preview:', e);
                        } finally {
                            this.loading = false;
                        }
                    }
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to switch method');
                    this.selectedMethod = this.currentMethod;
                }
            } catch (e) {
                alert('Failed to switch method: ' + e.message);
                this.selectedMethod = this.currentMethod;
            } finally {
                this.switching = false;
            }
        },

        getScoreColor(score) {
            if (score >= 0.8) return 'text-green-600 bg-green-100';
            if (score >= 0.5) return 'text-yellow-600 bg-yellow-100';
            return 'text-red-600 bg-red-100';
        },

        getVariantForMethod(method) {
            return this.variants.find(v => v.method === method) || {};
        }
    };
}
</script>
    <!-- Header Row -->
    <div class="px-4 py-3 border-b border-gray-200 bg-gray-50">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <!-- Title and Method Info -->
            <div class="flex items-center space-x-3">
                <svg class="h-5 w-5 text-green-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z" clip-rule="evenodd"/>
                </svg>
                <div>
                    <h3 class="text-sm font-medium text-gray-900">
                        Page {{ table.page_num }}, Table {{ table.table_num }}
                    </h3>
                    {% if table.extraction_method %}
                    <div class="flex items-center space-x-2 mt-1">
                        <!-- Method Selector (if variants available) -->
                        <template x-if="variantsAvailable && variants.length > 1">
                            <div class="relative">
                                <button
                                    @click="showMethodDropdown = !showMethodDropdown"
                                    @click.away="showMethodDropdown = false"
                                    class="inline-flex items-center text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200"
                                    :disabled="switching"
                                >
                                    <span x-text="selectedMethod || 'Select Method'"></span>
                                    <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>

                                <!-- Dropdown -->
                                <div
                                    x-show="showMethodDropdown"
                                    x-cloak
                                    class="absolute z-20 mt-1 w-64 bg-white rounded-md shadow-lg border border-gray-200 py-1"
                                    style="min-width: 16rem;"
                                >
                                    <template x-for="variant in variants.filter(v => v.has_data)" :key="variant.method">
                                        <button
                                            @click="selectedMethod = variant.method; showMethodDropdown = false; switchMethod()"
                                            class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 flex items-center justify-between"
                                            :class="{ 'bg-blue-50': variant.method === currentMethod }"
                                        >
                                            <div class="flex items-center space-x-2">
                                                <!-- Recommended star -->
                                                <template x-if="variant === variants.filter(v => v.has_data)[0]">
                                                    <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                                    </svg>
                                                </template>
                                                <span x-text="variant.method"></span>
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs px-1.5 py-0.5 rounded" :class="getScoreColor(variant.score)" x-text="variant.score.toFixed(2)"></span>
                                                <span class="text-xs text-gray-500" x-text="`${variant.rows}×${variant.cols}`"></span>
                                                <!-- Warning indicator -->
                                                <template x-if="variant.warnings && variant.warnings.length > 0">
                                                    <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" :title="variant.warnings.join(', ')">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                                    </svg>
                                                </template>
                                            </div>
                                        </button>
                                    </template>
                                    <!-- Show failed methods -->
                                    <template x-if="variants.some(v => !v.has_data)">
                                        <div class="border-t border-gray-100 mt-1 pt-1">
                                            <div class="px-3 py-1 text-xs text-gray-400">Failed methods:</div>
                                            <template x-for="variant in variants.filter(v => !v.has_data)" :key="variant.method">
                                                <div class="px-3 py-1 text-xs text-gray-400 flex items-center justify-between">
                                                    <span x-text="variant.method"></span>
                                                    <span x-text="variant.error || 'No data'" class="text-red-400"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Single method display (no variants or only one) -->
                        <template x-if="!variantsAvailable || variants.length <= 1">
                            <span class="text-xs text-gray-500">{{ table.extraction_method }}</span>
                        </template>

                        <!-- Score badge -->
                        {% if table.confidence_score %}
                        <span class="text-xs px-1.5 py-0.5 rounded"
                              :class="getScoreColor({{ table.confidence_score }})">
                            {{ table.confidence_score|floatformat:2 }}
                        </span>
                        {% endif %}
                    </div>
                    {% endif %}
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- Switching indicator -->
                <template x-if="switching">
                    <span class="text-xs text-blue-600 flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Switching...
                    </span>
                </template>

                <a x-show="csvUrl" :href="csvUrl" download class="inline-flex items-center px-2.5 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    CSV
                </a>
                <a x-show="jsonUrl" :href="jsonUrl" download class="inline-flex items-center px-2.5 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    JSON
                </a>
                <button
                    x-show="csvUrl"
                    @click="if (!previewData) { loading = true; fetch(`/table-preview/${extractedId}/`).then(r => r.json()).then(d => { previewData = d; loading = false; }); } showPreview = !showPreview"
                    class="inline-flex items-center px-2.5 py-1.5 border border-primary text-xs font-medium rounded text-primary bg-white hover:bg-blue-50"
                >
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <span x-text="showPreview ? 'Hide' : 'Preview'">Preview</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Preview Section -->
    <div x-show="showPreview" x-cloak class="border-t border-gray-200">
        <template x-if="loading">
            <div class="p-8 text-center">
                <svg class="animate-spin h-8 w-8 text-primary mx-auto" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-sm text-gray-500">Loading preview...</p>
            </div>
        </template>
        <template x-if="previewData && !loading">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <!-- Hierarchical headers with colspan/rowspan when header_spans available -->
                        <template x-if="previewData.header_spans && previewData.header_spans.length > 0">
                            <template x-for="rowIdx in [...new Set(previewData.header_spans.map(s => s.row))].sort()" :key="'row-' + rowIdx">
                                <tr>
                                    <template x-for="span in previewData.header_spans.filter(s => s.row === rowIdx)" :key="'span-' + span.row + '-' + span.col">
                                        <th :colspan="span.colspan > 1 ? span.colspan : null"
                                            :rowspan="span.rowspan > 1 ? span.rowspan : null"
                                            class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider border border-gray-200"
                                            x-text="span.value"></th>
                                    </template>
                                </tr>
                            </template>
                        </template>
                        <!-- Flat headers (fallback when no hierarchy) -->
                        <template x-if="!previewData.header_spans || previewData.header_spans.length === 0">
                            <tr>
                                <template x-for="(header, index) in previewData.headers" :key="index">
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="header || `Column ${index + 1}`"></th>
                                </template>
                            </tr>
                        </template>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="(row, rowIndex) in previewData.rows" :key="rowIndex">
                            <tr :class="rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50'">
                                <template x-for="(cell, cellIndex) in row" :key="cellIndex">
                                    <td class="px-4 py-2 text-sm text-gray-900 whitespace-nowrap" x-text="cell"></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template x-if="previewData.truncated">
                    <div class="px-4 py-2 bg-yellow-50 text-sm text-yellow-700 border-t border-yellow-100">
                        Showing first <span x-text="previewData.rows.length"></span> rows. Download the file for complete data.
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
